<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F7F4EF;
  --bg2: #EDEAE3;
  --bg3: #fff;
  --text: #1a1814;
  --text2: #6b6760;
  --text3: #9e9b96;
  --accent: #2D4A3E;
  --accent2: #4a7c66;
  --accent-light: #e8f0ec;
  --border: rgba(26,24,20,0.12);
  --border2: rgba(26,24,20,0.06);
  --serif: 'Playfair Display', Georgia, serif;
  --sans: 'DM Sans', system-ui, sans-serif;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 2px 16px rgba(26,24,20,0.08);
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

html { height: 100%; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  height: 100%;
  font-size: 15px;
  line-height: 1.6;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

/* ── LAYOUT ── */
.app { display: flex; height: 100vh; height: 100dvh; overflow: hidden; }

/* ── DESKTOP SIDEBAR ── */
.sidebar {
  width: 220px;
  background: var(--accent);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  overflow-y: auto;
  padding-top: calc(20px + var(--safe-top));
  padding-bottom: calc(16px + var(--safe-bottom));
}
.sidebar-logo {
  font-family: var(--serif);
  font-size: 22px;
  color: #e8f0ec;
  padding: 0 24px 24px;
  border-bottom: 1px solid rgba(232,240,236,0.15);
  margin-bottom: 12px;
}
.sidebar-logo span {
  color: rgba(232,240,236,0.45);
  font-style: italic;
  font-size: 12px;
  display: block;
  font-family: var(--sans);
  margin-top: 3px;
  font-weight: 300;
}
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 24px;
  color: rgba(232,240,236,0.6);
  cursor: pointer;
  font-size: 14px;
  font-weight: 400;
  transition: all 0.15s;
  border-left: 2px solid transparent;
  user-select: none;
}
.nav-item:hover { color: #e8f0ec; background: rgba(232,240,236,0.08); }
