<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Readmind">
<meta name="theme-color" content="#2D4A3E">
<link rel="manifest" href="/manifest.json">
<title>Readmind</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F4EF;--bg2:#EDEAE3;--bg3:#fff;
  --text:#1a1814;--text2:#6b6760;--text3:#9e9b96;
  --accent:#2D4A3E;--accent2:#4a7c66;--accent-light:#e8f0ec;
  --border:rgba(26,24,20,0.12);--border2:rgba(26,24,20,0.06);
  --serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;
  --radius:12px;--radius-sm:8px;--shadow:0 2px 16px rgba(26,24,20,0.08);
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh;height:100dvh}
.sidebar{width:230px;background:var(--accent);padding:24px 0;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-logo{font-family:var(--serif);font-size:22px;color:#e8f0ec;padding:0 22px 22px;border-bottom:1px solid rgba(232,240,236,0.15);margin-bottom:14px}
.sidebar-logo span{color:rgba(232,240,236,0.45);font-style:italic;font-size:12px;display:block;font-family:var(--sans);margin-top:2px;font-weight:300}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 22px;color:rgba(232,240,236,0.6);cursor:pointer;font-size:14px;transition:all .15s;border-left:2px solid transparent;position:relative}
.nav-item:hover{color:#e8f0ec;background:rgba(232,240,236,0.08)}
.nav-item.active{color:#e8f0ec;background:rgba(232,240,236,0.12);border-left-color:#e8f0ec;font-weight:500}
.nav-badge{position:absolute;right:14px;background:#e8f0ec;color:var(--accent);font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px}
.nav-section{font-size:10px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;color:rgba(232,240,236,0.3);padding:16px 22px 5px;display:flex;align-items:center;justify-content:space-between}
.nav-section-btn{background:none;border:none;color:rgba(232,240,236,0.4);cursor:pointer;font-size:16px;padding:0;line-height:1}
.nav-section-btn:hover{color:rgba(232,240,236,0.8)}
.book-nav-item{display:flex;align-items:center;gap:8px;padding:6px 22px 6px 34px;color:rgba(232,240,236,0.5);cursor:pointer;font-size:13px;transition:all .15s;overflow:hidden}
.book-nav-item:hover{color:rgba(232,240,236,0.85)}
.folder-nav-item{display:flex;align-items:center;gap:8px;padding:7px 22px 7px 22px;color:rgba(232,240,236,0.6);cursor:pointer;font-size:13px;transition:all .15s}
.folder-nav-item:hover{color:#e8f0ec}
.folder-nav-item.active{color:#e8f0ec;font-weight:500}
.folder-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.book-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.user-info{padding:14px 22px;border-top:1px solid rgba(232,240,236,0.15);margin-top:auto}
.user-name{font-size:13px;color:rgba(232,240,236,0.8);font-weight:500}
.user-email{font-size:11px;color:rgba(232,240,236,0.4);margin-top:1px}
.main{flex:1;overflow-y:auto}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg3);border-top:1px solid var(--border);z-index:50}
.bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 calc(8px + env(safe-area-inset-bottom));cursor:pointer;font-size:11px;color:var(--text3);font-weight:500;transition:color .15s;position:relative}
.bottom-nav-item.active{color:var(--accent)}
.bottom-nav-icon{font-size:20px}
.bottom-badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--accent);color:#e8f0ec;font-size:10px;font-weight:600;padding:1px 5px;border-radius:20px}
.fab{display:none;position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#e8f0ec;border:none;font-size:26px;cursor:pointer;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(45,74,62,0.35);z-index:40}
@media(max-width:768px){
  .sidebar{display:none}.bottom-nav{display:flex}.fab{display:flex}
  .main{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  .page-header{padding:calc(16px + env(safe-area-inset-top)) 16px 14px!important}
  .content{padding:16px!important}
  .stat-grid{grid-template-columns:1fr 1fr!important}
  .grid-2{grid-template-columns:1fr!important}
  .grid-auto{grid-template-columns:1fr!important}
  .modal{border-radius:var(--radius) var(--radius) 0 0;position:fixed;bottom:0;left:0;right:0;max-height:90vh;max-width:100%}
  .modal-overlay{align-items:flex-end;padding:0}
}
.page-header{padding:22px 34px 16px;border-bottom:1px solid var(--border2);background:var(--bg);display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;z-index:10}
.page-title{font-family:var(--serif);font-size:24px;font-weight:400}
.page-subtitle{font-size:13px;color:var(--text3);margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius-sm);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:none}
.btn-primary{background:var(--accent);color:#e8f0ec}.btn-primary:hover{background:#1e3329}
.btn-primary:disabled{opacity:0.5;cursor:default}
.btn-secondary{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-secondary:hover{background:var(--bg2)}
.btn-danger{background:transparent;color:#c0392b;border:1px solid rgba(192,57,43,0.3)}.btn-danger:hover{background:rgba(192,57,43,0.05)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{padding:8px;border-radius:var(--radius-sm);background:transparent;border:1px solid var(--border);color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;font-size:16px;transition:all .15s}
.content{padding:20px 34px}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--bg2);border-radius:var(--radius-sm);padding:14px 16px}
.stat-label{font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--text3)}
.stat-value{font-family:var(--serif);font-size:26px;font-weight:400;color:var(--accent);margin-top:4px}
.book-card{cursor:pointer;transition:all .2s}
.book-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(26,24,20,.1);border-color:var(--accent2)}
.book-spine{height:6px;border-radius:var(--radius) var(--radius) 0 0;margin:-20px -20px 16px}
.book-title{font-family:var(--serif);font-size:16px;font-weight:500;margin-bottom:3px;line-height:1.4}
.book-author{font-size:13px;color:var(--text3);margin-bottom:10px}
.book-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);flex-wrap:wrap}
.status-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.status-reading{background:#fff3e0;color:#e65100}
.status-done{background:#e8f5e9;color:#2e7d32}
.status-want{background:#e8f0ec;color:var(--accent)}
.stars{color:#f4a636;font-size:13px;letter-spacing:-1px}
.folder-card{cursor:pointer;transition:all .2s;border:1px solid var(--border)}
.folder-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(26,24,20,.1)}
.folder-header{height:48px;border-radius:var(--radius) var(--radius) 0 0;margin:-20px -20px 16px;display:flex;align-items:center;padding:0 18px;gap:10px}
.folder-name{font-family:var(--serif);font-size:17px;font-weight:500;margin-bottom:4px}
.folder-meta{font-size:12px;color:var(--text3)}
.folder-books-preview{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
.folder-book-chip{font-size:11px;padding:2px 8px;border-radius:12px;background:var(--bg2);color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.highlight-item{padding:14px 0;border-bottom:1px solid var(--border2)}
.highlight-item:last-child{border-bottom:none}
.highlight-text{font-family:var(--serif);font-size:15px;line-height:1.7;font-style:italic;border-left:3px solid var(--accent2);padding-left:14px;margin-bottom:6px}
.highlight-note{font-size:13px;color:var(--text2);padding-left:17px;margin-bottom:6px;line-height:1.5}
.highlight-meta{font-size:12px;color:var(--text3);display:flex;gap:10px;align-items:center;padding-left:17px;flex-wrap:wrap}
.share-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--accent2);background:var(--accent-light);padding:3px 9px;border-radius:20px;cursor:pointer;border:none;font-family:var(--sans)}
.share-btn:hover{background:#d4e8dc}
.inbox-item{padding:16px;border-radius:var(--radius-sm);margin-bottom:10px;border:1px solid var(--border)}
.inbox-item.unseen{background:#f0f7f4;border-color:rgba(74,124,102,0.3)}
.inbox-from{font-size:12px;color:var(--accent2);font-weight:500;margin-bottom:5px}
.inbox-book{font-size:12px;color:var(--text3);margin-bottom:8px}
.inbox-text{font-family:var(--serif);font-size:14px;line-height:1.65;font-style:italic;border-left:2px solid var(--accent2);padding-left:12px}
.matrix-bar-row{margin-bottom:14px}
.matrix-bar-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.matrix-bar-label{font-size:14px;font-weight:500}
.matrix-bar-pct{font-size:13px;color:var(--text3);font-family:var(--serif)}
.matrix-bar-track{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.matrix-bar-fill{height:100%;background:var(--accent2);border-radius:3px;transition:width 1.2s ease}
.insight-card{background:var(--accent-light);border:1px solid rgba(45,74,62,.15);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px}
.insight-label{font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
.insight-text{font-size:14px;line-height:1.65}
.blind-spot-pair{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px;flex-wrap:wrap}
.form-group{margin-bottom:15px}
label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:5px}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--sans);font-size:15px;color:var(--text);transition:border-color .15s;outline:none;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent2)}
textarea{resize:vertical;min-height:110px;line-height:1.6}
.modal-overlay{position:fixed;inset:0;background:rgba(26,24,20,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--bg3);border-radius:var(--radius);width:100%;max-width:500px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(26,24,20,.25)}
.modal-header{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-family:var(--serif);font-size:20px;font-weight:400}
.modal-body{padding:0 20px 24px}
.tabs{display:flex;gap:2px;background:var(--bg2);border-radius:var(--radius-sm);padding:3px;margin-bottom:16px}
.tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border-radius:6px;transition:all .15s}
.tab.active{background:var(--bg3);color:var(--text);box-shadow:0 1px 4px rgba(26,24,20,.08)}
.photo-drop{border:2px dashed var(--border);border-radius:var(--radius);padding:26px 20px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:12px}
.photo-drop:hover{border-color:var(--accent2);background:var(--accent-light)}
.photo-drop input{display:none}
.photo-preview{width:100%;max-height:180px;object-fit:contain;border-radius:var(--radius-sm);margin-bottom:10px}
.empty{text-align:center;padding:48px 20px}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-family:var(--serif);font-size:20px;font-weight:400;margin-bottom:8px}
.empty-sub{font-size:14px;color:var(--text3);max-width:280px;margin:0 auto 20px;line-height:1.6}
.analyzing{text-align:center;padding:48px 20px}
.analyzing-spinner{width:34px;height:34px;border:2px solid var(--bg2);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.analyzing-text{font-family:var(--serif);font-style:italic;color:var(--text2);font-size:16px}
.section-title{font-family:var(--serif);font-size:18px;font-weight:400}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.divider{border:none;border-top:1px solid var(--border2);margin:16px 0}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--accent-light);color:var(--accent)}
.color-picker{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-swatch.selected{border-color:var(--text);transform:scale(1.15)}
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.auth-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:36px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.auth-logo{font-family:var(--serif);font-size:28px;color:var(--accent);margin-bottom:6px}
.auth-sub{font-size:14px;color:var(--text3);margin-bottom:28px;line-height:1.5}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SUPA_URL='https://zgplzpsywcdarhqyyetw.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpncGx6cHN5d2NkYXJocXl5ZXR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyODI1OTYsImV4cCI6MjA5NDg1ODU5Nn0.UaybHdj12Ru6a_ziWTQ0HLubs23kmEDH8EymUDrOACk';
const ANT_KEY_STORE='rm_ant_key';
const FOLDER_COLORS=['#2D4A3E','#4a7c66','#8B7355','#6B5B7B','#4A6B8A','#7A5C4A','#B5614A','#3D6B5A'];
const BOOK_COLORS=['#2D4A3E','#4a7c66','#8B7355','#6B5B7B','#4A6B8A','#7A5C4A','#3D6B5A','#B5614A'];

const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

let S={
  user:null,profile:null,view:'library',
  books:[],highlights:{},inbox:[],inboxUnseen:0,
  folders:[],selectedFolder:null,
  selectedBook:null,matrix:null,matrixLoading:false,
  modal:null,authTab:'login',
  anthropicKey:localStorage.getItem(ANT_KEY_STORE)||'',
  allProfiles:[],photoTab:'text',
  selectedColor:FOLDER_COLORS[0],selectedStars:0
};

function set(p){S={...S,...p};render()}
function toast(msg,type=''){
  document.getElementById('toast')?.remove();
  const el=document.createElement('div');el.id='toast';
  el.style.cssText=`position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:${type==='error'?'#c0392b':'#1a1814'};color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;z-index:9999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3)`;
  el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),2800);
}

// AUTH
async function signUp(){
  const email=document.getElementById('auth-email')?.value?.trim();
  const pw=document.getElementById('auth-pw')?.value;
  const name=document.getElementById('auth-name')?.value?.trim();
  if(!email||!pw||!name){toast('Alle Felder ausfüllen','error');return}
  const btn=document.getElementById('auth-btn');btn.disabled=true;btn.textContent='...';
  const {error}=await sb.auth.signUp({email,password:pw,options:{data:{display_name:name}}});
  if(error){toast(error.message,'error');btn.disabled=false;btn.textContent='Registrieren';return}
  toast('Bestätigungs-E-Mail gesendet!');btn.disabled=false;btn.textContent='Registrieren';
}
async function signIn(){
  const email=document.getElementById('auth-email')?.value?.trim();
  const pw=document.getElementById('auth-pw')?.value;
  if(!email||!pw){toast('E-Mail und Passwort eingeben','error');return}
  const btn=document.getElementById('auth-btn');btn.disabled=true;btn.textContent='...';
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){toast(error.message,'error');btn.disabled=false;btn.textContent='Einloggen';}
}
async function signOut(){
  await sb.auth.signOut();
  set({user:null,profile:null,books:[],highlights:{},inbox:[],inboxUnseen:0,folders:[],selectedBook:null,matrix:null});
}

// DATA
async function loadAll(){
  const [booksRes,foldersRes]=await Promise.all([
    sb.from('books').select('*').order('added_at',{ascending:false}),
    sb.from('folders').select('*').order('created_at',{ascending:true})
  ]);
  set({books:booksRes.data||[],folders:foldersRes.data||[]});
}
async function loadHighlights(bookId){
  const {data}=await sb.from('highlights').select('*').eq('book_id',bookId).order('added_at',{ascending:false});
  set({highlights:{...S.highlights,[bookId]:data||[]}});
}
async function loadInbox(){
  const {data}=await sb.from('shared_highlights')
    .select('*, highlights(text,page,book_id,books(title,author)), profiles!shared_highlights_from_user_id_fkey(display_name)')
    .eq('to_user_id',S.user.id).order('shared_at',{ascending:false});
  const inbox=data||[];
  set({inbox,inboxUnseen:inbox.filter(i=>!i.seen).length});
}
async function loadProfiles(){
  const {data}=await sb.from('profiles').select('*').neq('id',S.user.id);
  set({allProfiles:data||[]});
}

// FOLDERS
async function addFolder(name,color){
  const {data,error}=await sb.from('folders').insert({user_id:S.user.id,name,color}).select().single();
  if(error){toast(error.message,'error');return}
  set({folders:[...S.folders,data],modal:null});toast('Ordner erstellt ✓');
}
async function deleteFolder(id){
  if(!confirm('Ordner löschen? Bücher bleiben erhalten.'))return;
  await sb.from('folders').delete().eq('id',id);
  await sb.from('books').update({folder_id:null}).eq('folder_id',id);
  set({
    folders:S.folders.filter(f=>f.id!==id),
    books:S.books.map(b=>b.folder_id===id?{...b,folder_id:null}:b),
    selectedFolder:S.selectedFolder===id?null:S.selectedFolder,
    view:S.selectedFolder===id?'folders':S.view,modal:null
  });
  toast('Ordner gelöscht');
}
async function assignToFolder(bookId,folderId){
  await sb.from('books').update({folder_id:folderId||null}).eq('id',bookId);
  set({books:S.books.map(b=>b.id===bookId?{...b,folder_id:folderId||null}:b),modal:null});
  toast(folderId?'Buch zugeordnet ✓':'Aus Ordner entfernt');
}

// BOOKS
async function addBook(title,author,status,rating,folderId){
  const color=BOOK_COLORS[S.books.length%BOOK_COLORS.length];
  const {data,error}=await sb.from('books').insert({user_id:S.user.id,title,author,color,status,rating,folder_id:folderId||null}).select().single();
  if(error){toast(error.message,'error');return}
  set({books:[data,...S.books],modal:null});toast('Buch hinzugefügt ✓');
}
async function updateBook(id,updates){
  await sb.from('books').update(updates).eq('id',id);
  set({books:S.books.map(b=>b.id===id?{...b,...updates}:b),modal:null});
  toast('Gespeichert ✓');
}
async function deleteBook(id){
  if(!confirm('Buch und alle Highlights löschen?'))return;
  await sb.from('books').delete().eq('id',id);
  const hl={...S.highlights};delete hl[id];
  set({books:S.books.filter(b=>b.id!==id),highlights:hl,view:'library',selectedBook:null,matrix:null});
  toast('Buch entfernt');
}

// HIGHLIGHTS
async function addHighlight(bookId,text,note,page){
  const {data,error}=await sb.from('highlights').insert({book_id:bookId,user_id:S.user.id,text,note,page}).select().single();
  if(error){toast(error.message,'error');return}
  set({highlights:{...S.highlights,[bookId]:[data,...(S.highlights[bookId]||[])]},modal:null,matrix:null,photoTab:'text'});
  toast('Highlight gespeichert ✓');
}
async function deleteHighlight(bookId,hlId){
  if(!confirm('Highlight löschen?'))return;
  await sb.from('highlights').delete().eq('id',hlId);
  set({highlights:{...S.highlights,[bookId]:(S.highlights[bookId]||[]).filter(h=>h.id!==hlId)},matrix:null});
}
async function shareHighlight(hlId,toUserId){
  const {error}=await sb.from('shared_highlights').insert({from_user_id:S.user.id,to_user_id:toUserId,highlight_id:hlId});
  if(error){toast(error.message,'error');return}
  set({modal:null});toast('Highlight geteilt ✓');
}
async function markSeen(id){
  await sb.from('shared_highlights').update({seen:true}).eq('id',id);
  const inbox=S.inbox.map(i=>i.id===id?{...i,seen:true}:i);
  set({inbox,inboxUnseen:Math.max(0,S.inboxUnseen-1)});
}

// OCR
async function extractText(base64,mime){
  if(!S.anthropicKey){toast('API Key fehlt','error');return null}
  const r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({apiKey:S.anthropicKey,model:'claude-sonnet-4-20250514',max_tokens:800,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mime,data:base64}},{type:'text',text:'Extrahiere den markierten oder relevanten Text aus diesem Bild. Nur den reinen Text, keine Erklärungen.'}]}]})});
  const d=await r.json();return d.content?.[0]?.text||null;
}

// MATRIX
async function analyze(){
  if(!S.anthropicKey){toast('API Key fehlt','error');set({modal:{type:'settings'}});return}
  const allHL=S.books.flatMap(b=>(S.highlights[b.id]||[]).map(h=>`[${b.title} von ${b.author}] "${h.text}"`));
  if(allHL.length<2){toast('Mindestens 2 Highlights erforderlich');return}
  set({matrixLoading:true,view:'matrix'});
  const prompt=`Highlights:\n\n${allHL.join('\n\n')}\n\nAntworte NUR als reines JSON:\n{"matrix":[{"thema":"Name","prozent":25,"beschreibung":"Kurz"}],"dominanteMuster":["M1","M2","M3"],"blindSpots":[{"vorhanden":"X","fehlend":"Y"},{"vorhanden":"X","fehlend":"Y"},{"vorhanden":"X","fehlend":"Y"}],"puzzleStueck":"Ein Satz.","naechstesBuch":"Titel — Autor","kerninsight":"Ein präziser Satz."}\n\n4-6 matrix-Einträge, Summe=100.`;
  try{
    const r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},body:JSON.stringify({apiKey:S.anthropicKey,model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})});
    const d=await r.json();if(d.error)throw new Error(d.error.message);
    const m=JSON.parse((d.content?.[0]?.text||'').replace(/```json|```/g,'').trim());
    set({matrix:m,matrixLoading:false});
  }catch(e){set({matrixLoading:false});toast('Fehler: '+e.message,'error')}
}

// HELPERS
function starsHTML(n){return'★'.repeat(n)+'☆'.repeat(5-n)}
function statusLabel(s){return s==='reading'?'Lese ich':s==='done'?'Gelesen':'Möchte lesen'}
function statusClass(s){return'status-'+(s==='reading'?'reading':s==='done'?'done':'want')}
function totalHL(){return S.books.reduce((s,b)=>s+(S.highlights[b.id]||[]).length,0)}
function folderBooks(fid){return S.books.filter(b=>b.folder_id===fid)}
function unassignedBooks(){return S.books.filter(b=>!b.folder_id)}

function renderApp(){
  const v=S.view;
  const book=S.selectedBook?S.books.find(b=>b.id===S.selectedBook):null;

  if(v==='library')main=viewLibrary();
  else if(v==='folders')main=viewFolders();
  else if(v==='folder'&&S.selectedFolder)main=viewFolder(S.folders.find(f=>f.id===S.selectedFolder));
  else if(v==='book'&&book)main=viewBook(book);
  else if(v==='matrix')main=viewMatrix();
  else if(v==='inbox')main=viewInbox();
  else if(v==='friend')main=viewFriend();
  else main=viewLibrary();

  let modal='';
  if(S.modal){
    const m=S.modal;
    if(m.type==='addBook')modal=modalAddBook();
    else if(m.type==='addHighlight')modal=modalAddHighlight(m.bookId);
    else if(m.type==='share')modal=modalShare(m.hlId);
    else if(m.type==='settings')modal=modalSettings();
    else if(m.type==='editBook')modal=modalEditBook(m.book);
    else if(m.type==='addFolder')modal=modalAddFolder();
    else if(m.type==='assignFolder')modal=modalAssignFolder(m.bookId);

  document.getElementById('root').innerHTML=`<div class="app">${renderSidebar()}<div class="main">${main}${renderBottomNav()}</div></div>${modal}`;
}

  const m=S.matrix;
  const bars=m.matrix.map(t=>`<div class="matrix-bar-row"><div class="matrix-bar-header"><span class="matrix-bar-label">${t.thema}</span><span class="matrix-bar-pct">${t.prozent}%</span></div><div class="matrix-bar-track"><div class="matrix-bar-fill" style="width:${t.prozent}%"></div></div><div style="font-size:12px;color:var(--text3);margin-top:3px">${t.beschreibung}</div></div>`).join('');
  const bsp=m.blindSpots.map(b=>`<div class="blind-spot-pair"><span style="color:var(--accent);font-weight:500">viel ${b.vorhanden}</span><span style="color:var(--text3)">→</span><span style="color:var(--text2)">wenig ${b.fehlend}</span></div>`).join('');

  return`<div class="page-header"><div><div class="page-title">Wissensmatrix</div><div class="page-subtitle">${totalHL()} Highlights · ${S.books.length} Bücher</div></div><button class="btn btn-secondary btn-sm" onclick="analyze()">Neu analysieren</button></div>

      <div class="card"><div class="section-header"><div class="section-title">Themenverteilung</div></div>${bars}</div>

window.submitAddBook=(folderId)=>{

  addBook(t,a,s,S.selectedStars,f||null);S.selectedStars=0;
};

  const s=document.getElementById('eb-status')?.value;
  updateBook(id,{status:s,rating:S.selectedStars});S.selectedStars=0;
};

window.submitHighlight=(bookId)=>{
  const text=document.getElementById('hl-text')?.value?.trim();
  const note=document.getElementById('hl-note')?.value?.trim();
  const page=document.getElementById('hl-page')?.value?.trim();
  if(!text){toast('Bitte Text eingeben','error');return}
  addHighlight(bookId,text,note||null,page||null);
};

window.handlePhoto=async(event,bookId)=>{
  const file=event.target.files[0];if(!file)return;
  const reader=new FileReader();
  const img=new Image();
  const objectUrl=URL.createObjectURL(file);
  img.onload=async()=>{
    URL.revokeObjectURL(objectUrl);
    const canvas=document.createElement('canvas');
    let w=img.width,h=img.height;
    const maxSize=1200;
    if(w>maxSize||h>maxSize){if(w>h){h=Math.round(h*maxSize/w);w=maxSize;}else{w=Math.round(w*maxSize/h);h=maxSize;}}
    canvas.width=w;canvas.height=h;
    canvas.getContext('2d').drawImage(img,0,0,w,h);
    const compressed=canvas.toDataURL('image/jpeg',0.75);
    const base64=compressed.split(',')[1];
    const preview=document.getElementById('photo-preview-area');
    if(preview)preview.innerHTML=`<img src="${compressed}" class="photo-preview"/><div style="font-size:13px;color:var(--accent2)">⏳ Text wird extrahiert...</div>`;
    const btn=document.getElementById('hl-save-btn');if(btn)btn.disabled=true;
    const text=await extractText(base64,'image/jpeg');
    if(text){
      const ex=document.getElementById('hl-text-extracted');if(ex)ex.style.display='block';
      const ta=document.getElementById('hl-text');if(ta)ta.value=text;
      if(preview)preview.innerHTML=`<img src="${compressed}" class="photo-preview"/><div style="font-size:13px;color:var(--accent2)">✓ Text extrahiert</div>`;
    }else{
      if(preview)preview.innerHTML=`<img src="${compressed}" class="photo-preview"/><div style="font-size:13px;color:#c0392b">Extraktion fehlgeschlagen — bitte manuell eingeben</div>`;
    }
    if(btn)btn.disabled=false;
  };
  img.src=objectUrl;
};

  S.anthropicKey=key;localStorage.setItem(ANT_KEY_STORE,key);
