<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Readmind">
<meta name="theme-color" content="#2D4A3E">
<link rel="manifest" href="/manifest.json">
<title>Readmind</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F7F4EF;--bg2:#EDEAE3;--bg3:#fff;
  --text:#1a1814;--text2:#6b6760;--text3:#9e9b96;
  --accent:#2D4A3E;--accent2:#4a7c66;--accent-light:#e8f0ec;
  --border:rgba(26,24,20,0.12);--border2:rgba(26,24,20,0.06);
  --serif:'Playfair Display',Georgia,serif;--sans:'DM Sans',system-ui,sans-serif;
  --radius:12px;--radius-sm:8px;--shadow:0 2px 16px rgba(26,24,20,0.08);
}
html,body{height:100%;overflow:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--text);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh;height:100dvh}
.sidebar{width:230px;background:var(--accent);padding:24px 0;display:flex;flex-direction:column;flex-shrink:0;overflow-y:auto}
.sidebar-logo{font-family:var(--serif);font-size:22px;color:#e8f0ec;padding:0 22px 22px;border-bottom:1px solid rgba(232,240,236,0.15);margin-bottom:14px}
.sidebar-logo span{color:rgba(232,240,236,0.45);font-style:italic;font-size:12px;display:block;font-family:var(--sans);margin-top:2px;font-weight:300}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 22px;color:rgba(232,240,236,0.6);cursor:pointer;font-size:14px;transition:all .15s;border-left:2px solid transparent;position:relative}
.nav-item:hover{color:#e8f0ec;background:rgba(232,240,236,0.08)}
.nav-item.active{color:#e8f0ec;background:rgba(232,240,236,0.12);border-left-color:#e8f0ec;font-weight:500}
.nav-badge{position:absolute;right:14px;background:#e8f0ec;color:var(--accent);font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px}
.nav-section{font-size:10px;font-weight:500;letter-spacing:1.2px;text-transform:uppercase;color:rgba(232,240,236,0.3);padding:16px 22px 5px;display:flex;align-items:center;justify-content:space-between}
.nav-section-btn{background:none;border:none;color:rgba(232,240,236,0.4);cursor:pointer;font-size:16px;padding:0;line-height:1}
.nav-section-btn:hover{color:rgba(232,240,236,0.8)}
.book-nav-item{display:flex;align-items:center;gap:8px;padding:6px 22px 6px 34px;color:rgba(232,240,236,0.5);cursor:pointer;font-size:13px;transition:all .15s;overflow:hidden}
.book-nav-item:hover{color:rgba(232,240,236,0.85)}
.folder-nav-item{display:flex;align-items:center;gap:8px;padding:7px 22px;color:rgba(232,240,236,0.6);cursor:pointer;font-size:13px;transition:all .15s}
.folder-nav-item:hover{color:#e8f0ec}
.folder-nav-item.active{color:#e8f0ec;font-weight:500}
.folder-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.book-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.user-info{padding:14px 22px;border-top:1px solid rgba(232,240,236,0.15);margin-top:auto}
.user-name{font-size:13px;color:rgba(232,240,236,0.8);font-weight:500}
.user-email{font-size:11px;color:rgba(232,240,236,0.4);margin-top:1px}
.main{flex:1;overflow-y:auto}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg3);border-top:1px solid var(--border);z-index:50}
.bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 calc(8px + env(safe-area-inset-bottom));cursor:pointer;font-size:11px;color:var(--text3);font-weight:500;transition:color .15s;position:relative}
.bottom-nav-item.active{color:var(--accent)}
.bottom-nav-icon{font-size:20px}
.bottom-badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--accent);color:#e8f0ec;font-size:10px;font-weight:600;padding:1px 5px;border-radius:20px}
.fab{display:none;position:fixed;bottom:calc(76px + env(safe-area-inset-bottom));right:20px;width:52px;height:52px;border-radius:50%;background:var(--accent);color:#e8f0ec;border:none;font-size:26px;cursor:pointer;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(45,74,62,0.35);z-index:40}
@media(max-width:768px){
  .sidebar{display:none}.bottom-nav{display:flex}.fab{display:flex}
  .main{padding-bottom:calc(60px + env(safe-area-inset-bottom))}
  .page-header{padding:calc(16px + env(safe-area-inset-top)) 16px 14px!important}
  .content{padding:16px!important}
  .stat-grid{grid-template-columns:1fr 1fr!important}
  .grid-2{grid-template-columns:1fr!important}
  .grid-auto{grid-template-columns:1fr!important}
  .modal{border-radius:var(--radius) var(--radius) 0 0;position:fixed;bottom:0;left:0;right:0;max-height:90vh;max-width:100%}
  .modal-overlay{align-items:flex-end;padding:0}
}
.page-header{padding:22px 34px 16px;border-bottom:1px solid var(--border2);background:var(--bg);display:flex;align-items:flex-start;justify-content:space-between;position:sticky;top:0;z-index:10}
.page-title{font-family:var(--serif);font-size:24px;font-weight:400}
.page-subtitle{font-size:13px;color:var(--text3);margin-top:3px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius-sm);font-family:var(--sans);font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;border:none}
.btn-primary{background:var(--accent);color:#e8f0ec}.btn-primary:hover{background:#1e3329}
.btn-primary:disabled{opacity:0.5;cursor:default}
.btn-secondary{background:transparent;color:var(--text2);border:1px solid var(--border)}.btn-secondary:hover{background:var(--bg2)}
.btn-danger{background:transparent;color:#c0392b;border:1px solid rgba(192,57,43,0.3)}.btn-danger:hover{background:rgba(192,57,43,0.05)}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{padding:8px;border-radius:var(--radius-sm);background:transparent;border:1px solid var(--border);color:var(--text2);cursor:pointer;display:inline-flex;align-items:center;font-size:16px;transition:all .15s}
.content{padding:20px 34px}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--bg2);border-radius:var(--radius-sm);padding:14px 16px}
.stat-label{font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--text3)}
.stat-value{font-family:var(--serif);font-size:26px;font-weight:400;color:var(--accent);margin-top:4px}
.book-card{cursor:pointer;transition:all .2s}
.book-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(26,24,20,.1);border-color:var(--accent2)}
.book-spine{height:6px;border-radius:var(--radius) var(--radius) 0 0;margin:-20px -20px 16px}
.book-title{font-family:var(--serif);font-size:16px;font-weight:500;margin-bottom:3px;line-height:1.4}
.book-author{font-size:13px;color:var(--text3);margin-bottom:10px}
.book-meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text3);flex-wrap:wrap}
.status-badge{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px}
.status-reading{background:#fff3e0;color:#e65100}
.status-done{background:#e8f5e9;color:#2e7d32}
.status-want{background:#e8f0ec;color:var(--accent)}
.stars{color:#f4a636;font-size:13px;letter-spacing:-1px}
.folder-card{cursor:pointer;transition:all .2s;border:1px solid var(--border)}
.folder-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(26,24,20,.1)}
.folder-header{height:48px;border-radius:var(--radius) var(--radius) 0 0;margin:-20px -20px 16px;display:flex;align-items:center;padding:0 18px;gap:10px}
.folder-name{font-family:var(--serif);font-size:17px;font-weight:500;margin-bottom:4px}
.folder-meta{font-size:12px;color:var(--text3)}
.folder-book-chip{font-size:11px;padding:2px 8px;border-radius:12px;background:var(--bg2);color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
.highlight-item{padding:14px 0;border-bottom:1px solid var(--border2)}
.highlight-item:last-child{border-bottom:none}
.highlight-text{font-family:var(--serif);font-size:15px;line-height:1.7;font-style:italic;border-left:3px solid var(--accent2);padding-left:14px;margin-bottom:6px}
.highlight-note{font-size:13px;color:var(--text2);padding-left:17px;margin-bottom:6px;line-height:1.5}
.highlight-meta{font-size:12px;color:var(--text3);display:flex;gap:10px;align-items:center;padding-left:17px;flex-wrap:wrap}
.highlight-img{width:100%;max-height:200px;object-fit:contain;border-radius:8px;margin-bottom:10px}
.share-btn{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:500;color:var(--accent2);background:var(--accent-light);padding:3px 9px;border-radius:20px;cursor:pointer;border:none;font-family:var(--sans)}
.share-btn:hover{background:#d4e8dc}
.inbox-item{padding:16px;border-radius:var(--radius-sm);margin-bottom:10px;border:1px solid var(--border)}
.inbox-item.unseen{background:#f0f7f4;border-color:rgba(74,124,102,0.3)}
.inbox-from{font-size:12px;color:var(--accent2);font-weight:500;margin-bottom:5px}
.inbox-book{font-size:12px;color:var(--text3);margin-bottom:8px}
.inbox-text{font-family:var(--serif);font-size:14px;line-height:1.65;font-style:italic;border-left:2px solid var(--accent2);padding-left:12px}
.matrix-bar-row{margin-bottom:14px}
.matrix-bar-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.matrix-bar-label{font-size:14px;font-weight:500}
.matrix-bar-pct{font-size:13px;color:var(--text3);font-family:var(--serif)}
.matrix-bar-track{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.matrix-bar-fill{height:100%;background:var(--accent2);border-radius:3px;transition:width 1.2s ease}
.insight-card{background:var(--accent-light);border:1px solid rgba(45,74,62,.15);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px}
.insight-label{font-size:11px;font-weight:500;letter-spacing:.8px;text-transform:uppercase;color:var(--accent2);margin-bottom:6px}
.insight-text{font-size:14px;line-height:1.65}
.blind-spot-pair{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px;flex-wrap:wrap}
.form-group{margin-bottom:15px}
label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:5px}
input[type=text],input[type=email],input[type=password],textarea,select{width:100%;padding:11px 14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);font-family:var(--sans);font-size:15px;color:var(--text);transition:border-color .15s;outline:none;-webkit-appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent2)}
textarea{resize:vertical;min-height:110px;line-height:1.6}
.modal-overlay{position:fixed;inset:0;background:rgba(26,24,20,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.modal{background:var(--bg3);border-radius:var(--radius);width:100%;max-width:500px;max-height:92vh;overflow-y:auto;box-shadow:0 20px 60px rgba(26,24,20,.25)}
.modal-header{padding:20px 20px 0;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-family:var(--serif);font-size:20px;font-weight:400}
.modal-body{padding:0 20px 24px}
.tabs{display:flex;gap:2px;background:var(--bg2);border-radius:var(--radius-sm);padding:3px;margin-bottom:16px}
.tab{flex:1;padding:8px;text-align:center;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border-radius:6px;transition:all .15s}
.tab.active{background:var(--bg3);color:var(--text);box-shadow:0 1px 4px rgba(26,24,20,.08)}
.photo-drop{border:2px dashed var(--border);border-radius:var(--radius);padding:26px 20px;text-align:center;cursor:pointer;transition:all .15s;margin-bottom:12px}
.photo-drop:hover{border-color:var(--accent2);background:var(--accent-light)}
.photo-drop input{display:none}
.photo-preview{width:100%;max-height:180px;object-fit:contain;border-radius:var(--radius-sm);margin-bottom:10px}
.empty{text-align:center;padding:48px 20px}
.empty-icon{font-size:40px;margin-bottom:12px}
.empty-title{font-family:var(--serif);font-size:20px;font-weight:400;margin-bottom:8px}
.empty-sub{font-size:14px;color:var(--text3);max-width:280px;margin:0 auto 20px;line-height:1.6}
.analyzing{text-align:center;padding:48px 20px}
.analyzing-spinner{width:34px;height:34px;border:2px solid var(--bg2);border-top-color:var(--accent2);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.analyzing-text{font-family:var(--serif);font-style:italic;color:var(--text2);font-size:16px}
.section-title{font-family:var(--serif);font-size:18px;font-weight:400}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.divider{border:none;border-top:1px solid var(--border2);margin:16px 0}
.tag{display:inline-flex;align-items:center;font-size:11px;font-weight:500;padding:3px 10px;border-radius:20px;background:var(--accent-light);color:var(--accent)}
.color-picker{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:all .15s}
.color-swatch.selected{border-color:var(--text);transform:scale(1.15)}
.auth-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:20px}
.auth-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:36px;width:100%;max-width:400px;box-shadow:var(--shadow)}
.auth-logo{font-family:var(--serif);font-size:28px;color:var(--accent);margin-bottom:6px}
.auth-sub{font-size:14px;color:var(--text3);margin-bottom:28px;line-height:1.5}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const SUPA_URL='https://zgplzpsywcdarhqyyetw.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpncGx6cHN5d2NkYXJocXl5ZXR3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkyODI1OTYsImV4cCI6MjA5NDg1ODU5Nn0.UaybHdj12Ru6a_ziWTQ0HLubs23kmEDH8EymUDrOACk';
const ANT_KEY='rm_ant_key';
const FOLDER_COLORS=['#2D4A3E','#4a7c66','#8B7355','#6B5B7B','#4A6B8A','#7A5C4A','#B5614A','#3D6B5A'];
const BOOK_COLORS=['#2D4A3E','#4a7c66','#8B7355','#6B5B7B','#4A6B8A','#7A5C4A','#3D6B5A','#B5614A'];
const sb=supabase.createClient(SUPA_URL,SUPA_KEY);

let S={user:null,profile:null,view:'library',books:[],highlights:{},inbox:[],inboxUnseen:0,folders:[],selectedFolder:null,selectedBook:null,matrix:null,matrixLoading:false,modal:null,authTab:'login',anthropicKey:localStorage.getItem(ANT_KEY)||'',allProfiles:[],photoTab:'text',selectedColor:FOLDER_COLORS[0],selectedStars:0,_pendingImagePath:null};

function set(p){S=Object.assign({},S,p);render();}
function toast(msg,type){
  var el=document.getElementById('toast');if(el)el.remove();
  el=document.createElement('div');el.id='toast';
  el.style.cssText='position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:'+(type==='error'?'#c0392b':'#1a1814')+';color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;z-index:9999;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.3)';
  el.textContent=msg;document.body.appendChild(el);setTimeout(function(){el.remove();},2800);
}

async function signUp(){
  var email=document.getElementById('auth-email').value.trim();
  var pw=document.getElementById('auth-pw').value;
  var name=document.getElementById('auth-name').value.trim();
  if(!email||!pw||!name){toast('Alle Felder ausfüllen','error');return;}
  var btn=document.getElementById('auth-btn');btn.disabled=true;btn.textContent='...';
  var res=await sb.auth.signUp({email:email,password:pw,options:{data:{display_name:name}}});
  if(res.error){toast(res.error.message,'error');btn.disabled=false;btn.textContent='Registrieren';return;}
  toast('Registriert! Bitte einloggen.');btn.disabled=false;btn.textContent='Registrieren';
  set({authTab:'login'});
}
async function signIn(){
  var email=document.getElementById('auth-email').value.trim();
  var pw=document.getElementById('auth-pw').value;
  if(!email||!pw){toast('E-Mail und Passwort eingeben','error');return;}
  var btn=document.getElementById('auth-btn');btn.disabled=true;btn.textContent='...';
  var res=await sb.auth.signInWithPassword({email:email,password:pw});
  if(res.error){toast(res.error.message,'error');btn.disabled=false;btn.textContent='Einloggen';}
}
async function signOut(){
  await sb.auth.signOut();
  set({user:null,profile:null,books:[],highlights:{},inbox:[],inboxUnseen:0,folders:[],selectedBook:null,matrix:null});
}

async function loadAll(){
  var br=await sb.from('books').select('*').order('added_at',{ascending:false});
  var fr=await sb.from('folders').select('*').order('created_at',{ascending:true});
  S.books=br.data||[];S.folders=fr.data||[];render();
}
async function loadHighlights(bookId){
  var res=await sb.from('highlights').select('*').eq('book_id',bookId).order('added_at',{ascending:false});
  S.highlights=Object.assign({},S.highlights);S.highlights[bookId]=res.data||[];
}
async function loadInbox(){
  var res=await sb.from('shared_highlights').select('*, highlights(text,page,book_id,books(title,author)), profiles!shared_highlights_from_user_id_fkey(display_name)').eq('to_user_id',S.user.id).order('shared_at',{ascending:false});
  var inbox=res.data||[];
  S.inbox=inbox;S.inboxUnseen=inbox.filter(function(i){return !i.seen;}).length;
}
async function loadProfiles(){
  var res=await sb.from('profiles').select('*').neq('id',S.user.id);
  S.allProfiles=res.data||[];
}

async function uploadImage(file,userId){
  var ext=(file.name||'photo.jpg').split('.').pop()||'jpg';
  var path=userId+'/'+Date.now()+'.'+ext;
  var res=await sb.storage.from('highlights').upload(path,file,{upsert:true});
  if(res.error){toast('Foto-Upload fehlgeschlagen: '+res.error.message,'error');return null;}
  return path;
}

async function addFolder(name,color){
  var res=await sb.from('folders').insert({user_id:S.user.id,name:name,color:color}).select().single();
  if(res.error){toast(res.error.message,'error');return;}
  S.folders=S.folders.concat([res.data]);set({modal:null});toast('Ordner erstellt');
}
async function deleteFolder(id){
  if(!confirm('Ordner löschen? Bücher bleiben erhalten.'))return;
  await sb.from('folders').delete().eq('id',id);
  await sb.from('books').update({folder_id:null}).eq('folder_id',id);
  S.books=S.books.map(function(b){return b.folder_id===id?Object.assign({},b,{folder_id:null}):b;});
  S.folders=S.folders.filter(function(f){return f.id!==id;});
  set({selectedFolder:S.selectedFolder===id?null:S.selectedFolder,view:S.selectedFolder===id?'folders':S.view,modal:null});
  toast('Ordner gelöscht');
}
async function assignToFolder(bookId,folderId){
  await sb.from('books').update({folder_id:folderId||null}).eq('id',bookId);
  S.books=S.books.map(function(b){return b.id===bookId?Object.assign({},b,{folder_id:folderId||null}):b;});
  set({modal:null});toast(folderId?'Buch zugeordnet':'Aus Ordner entfernt');
}
async function addBook(title,author,status,rating,folderId){
  var color=BOOK_COLORS[S.books.length%BOOK_COLORS.length];
  var res=await sb.from('books').insert({user_id:S.user.id,title:title,author:author,color:color,status:status,rating:rating,folder_id:folderId||null}).select().single();
  if(res.error){toast(res.error.message,'error');return;}
  S.books=[res.data].concat(S.books);set({modal:null});toast('Buch hinzugefügt');
}
async function updateBook(id,updates){
  await sb.from('books').update(updates).eq('id',id);
  S.books=S.books.map(function(b){return b.id===id?Object.assign({},b,updates):b;});
  set({modal:null});toast('Gespeichert');
}
async function deleteBook(id){
  if(!confirm('Buch und alle Highlights löschen?'))return;
  await sb.from('books').delete().eq('id',id);
  var hl=Object.assign({},S.highlights);delete hl[id];
  set({books:S.books.filter(function(b){return b.id!==id;}),highlights:hl,view:'library',selectedBook:null,matrix:null});
  toast('Buch entfernt');
}
async function addHighlight(bookId,text,note,page,imagePath){
  var res=await sb.from('highlights').insert({book_id:bookId,user_id:S.user.id,text:text,note:note,page:page,image_url:imagePath||null}).select().single();
  if(res.error){toast(res.error.message,'error');return;}
  var existing=S.highlights[bookId]||[];
  S.highlights=Object.assign({},S.highlights);S.highlights[bookId]=[res.data].concat(existing);
  set({modal:null,matrix:null,photoTab:'text',_pendingImagePath:null});toast('Highlight gespeichert');
}
async function deleteHighlight(bookId,hlId){
  if(!confirm('Highlight löschen?'))return;
  await sb.from('highlights').delete().eq('id',hlId);
  S.highlights=Object.assign({},S.highlights);
  S.highlights[bookId]=(S.highlights[bookId]||[]).filter(function(h){return h.id!==hlId;});
  set({matrix:null});
}
async function shareHighlight(hlId,toUserId){

async function markSeen(id){
  await sb.from('shared_highlights').update({seen:true}).eq('id',id);
  S.inbox=S.inbox.map(function(i){return i.id===id?Object.assign({},i,{seen:true}):i;});

}

async function analyze(){
  if(!S.anthropicKey){toast('API Key fehlt','error');set({modal:{type:'settings'}});return;}
  var allHL=S.books.reduce(function(acc,b){
    var hls=(S.highlights[b.id]||[]).map(function(h){return {book:b.title,author:b.author,text:h.text,image:h.image_url};});
    return acc.concat(hls);
  },[]);
  if(allHL.length<2){toast('Mindestens 2 Highlights erforderlich');return;}
  set({matrixLoading:true,view:'matrix'});
  var textLines=allHL.map(function(h){return '['+h.book+' von '+h.author+'] "'+h.text+'"';}).join('\n\n');
  var schema='{"matrix":[{"thema":"Name","prozent":25,"beschreibung":"Kurz"}],"dominanteMuster":["M1","M2","M3"],"blindSpots":[{"vorhanden":"X","fehlend":"Y"},{"vorhanden":"X","fehlend":"Y"},{"vorhanden":"X","fehlend":"Y"}],"puzzleStueck":"Ein Satz.","naechstesBuch":"Titel - Autor","kerninsight":"Ein präziser Satz."}';
  var promptText='Analysiere diese Highlights:\n\n'+textLines+'\n\nAntworte NUR als reines JSON:\n'+schema+'\n\n4-6 matrix-Einträge, Summe=100.';
  var msgContent=[{type:'text',text:promptText}];
  var imageHLs=allHL.filter(function(h){return h.image;});
  for(var i=0;i<imageHLs.length;i++){
    try{
      var dl=await sb.storage.from('highlights').download(imageHLs[i].image);
      if(dl.data){
        var b64=await new Promise(function(resolve){
          var reader=new FileReader();
          reader.onload=function(e){resolve(e.target.result.split(',')[1]);};
          reader.readAsDataURL(dl.data);
        });
        msgContent.push({type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}});
      }
    }catch(e){}
  }
  try{
    var r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({apiKey:S.anthropicKey,model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:msgContent}]})});
    var d=await r.json();
    if(d.error)throw new Error(d.error.message);
    var m=JSON.parse((d.content&&d.content[0]?d.content[0].text:'').replace(/```json|```/g,'').trim());
    set({matrix:m,matrixLoading:false});
  }catch(e){set({matrixLoading:false});toast('Fehler: '+e.message,'error');}
}

function parseKindleClippings(text){
  var books={};
  var entries=text.split('==========');
  entries.forEach(function(entry){
    var lines=entry.trim().split('\n').filter(function(l){return l.trim();});
    if(lines.length<3)return;
    var titleLine=lines[0].trim();
    // Extract title and author: "Title (Author)" or just "Title"
    var title=titleLine,author='Unbekannt';
    var match=titleLine.match(/^(.+?)\s*\(([^)]+)\)\s*$/);
    if(match){title=match[1].trim();author=match[2].trim();}
    // Find highlight text (skip metadata line)
    var textLines=lines.slice(2).join(' ').trim();
    if(!textLines||textLines.length<5)return;
    // Extract page if available
    var page='';
    var metaLine=lines[1]||'';
    var pageMatch=metaLine.match(/[Ss]eite\s+(\d+)|[Pp]age\s+(\d+)|[Ll]ocation\s+(\d+)/);
    if(pageMatch)page=pageMatch[1]||pageMatch[2]||pageMatch[3]||'';
    if(!books[title])books[title]={title:title,author:author,highlights:[]};
    books[title].highlights.push({text:textLines,page:page});
  });
  return Object.values(books);
}

window.submitPasteImport=async function(){
  var text=(document.getElementById('paste-text')||{value:''}).value.trim();
  var bookSel=(document.getElementById('paste-book')||{value:''}).value;
  if(!text){toast('Bitte Text einfügen','error');return;}
  if(!bookSel){toast('Bitte Buch auswählen','error');return;}
  var bookId;
  if(bookSel==='__new__'){
    var t=(document.getElementById('paste-book-title')||{value:''}).value.trim();
    var a=(document.getElementById('paste-book-author')||{value:''}).value.trim();
    if(!t||!a){toast('Titel und Autor eingeben','error');return;}
    var color=BOOK_COLORS[S.books.length%BOOK_COLORS.length];
    var res=await sb.from('books').insert({user_id:S.user.id,title:t,author:a,color:color,status:'reading',rating:0}).select().single();
    if(res.error){toast(res.error.message,'error');return;}
    S.books=[res.data].concat(S.books);
    bookId=res.data.id;
  }else{
    bookId=bookSel;
  }
  // Split text into individual highlights (split by double newline or long dashes)
  var lines=text.split(/\n{2,}|—{3,}/).map(function(l){return l.trim();}).filter(function(l){return l.length>5;});
  if(!lines.length)lines=[text];
  var imported=0;
  for(var i=0;i<lines.length;i++){
    var hl=lines[i];
    if(!hl||hl.length<5)continue;
    var res=await sb.from('highlights').insert({book_id:bookId,user_id:S.user.id,text:hl,note:null,page:null,image_url:null}).select().single();
    if(!res.error){imported++;if(!S.highlights[bookId])S.highlights[bookId]=[];S.highlights[bookId]=[res.data].concat(S.highlights[bookId]);}
  }
  set({matrix:null});
  toast(imported+' Highlight'+(imported!==1?'s':'')+' importiert');
  document.getElementById('paste-text').value='';
  document.getElementById('paste-book').value='';
};

};

window.handleKindleFile=function(event){
  var file=event.target.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    var text=e.target.result;
    var preview=parseKindleClippings(text);
    if(!preview.length){toast('Keine Highlights gefunden. Ist es eine My Clippings.txt?','error');return;}
    set({_kindlePreview:preview});
    toast(preview.length+' Bücher erkannt');
  };
  reader.readAsText(file,'UTF-8');
};

window.importKindle=async function(){
  var preview=S._kindlePreview;if(!preview)return;
  var btn=document.querySelector('.btn-primary[onclick="importKindle()"]');
  if(btn){btn.disabled=true;btn.textContent='Importiere...';}
  var imported=0,skipped=0;
  for(var i=0;i<preview.length;i++){
    var b=preview[i];
    // Check if book already exists
    var existing=S.books.find(function(x){return x.title.toLowerCase()===b.title.toLowerCase();});
    var bookId;
    if(existing){
      bookId=existing.id;
    }else{
      var color=BOOK_COLORS[(S.books.length+i)%BOOK_COLORS.length];
      var res=await sb.from('books').insert({user_id:S.user.id,title:b.title,author:b.author,color:color,status:'done',rating:0}).select().single();
      if(res.error){skipped++;continue;}
      S.books=[res.data].concat(S.books);
      bookId=res.data.id;
    }
    // Import highlights
    for(var j=0;j<b.highlights.length;j++){
      var h=b.highlights[j];
      if(!h.text||h.text.length<5){skipped++;continue;}
      var hr=await sb.from('highlights').insert({book_id:bookId,user_id:S.user.id,text:h.text,page:h.page||null,note:null,image_url:null}).select().single();
      if(!hr.error)imported++;else skipped++;
    }
  }
  set({_kindlePreview:null,matrix:null});
  await loadAll();
  toast(imported+' Highlights importiert'+(skipped>0?' ('+skipped+' übersprungen)':''));
  set({view:'library'});
};

    +'</div></div>'

    +'<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">'
    +'<button class="btn btn-secondary" onclick="set({modal:null,photoTab:\'text\'})">Abbrechen</button>'
    +'<button class="btn btn-primary" id="hl-save-btn" onclick="submitHighlight(\''+bookId+'\')">Speichern</button>'
    +'</div></div></div></div>';
}

function modalShare(hlId){
  var profiles=S.allProfiles;
  return '<div class="modal-overlay" onclick="if(event.target===this)set({modal:null})"><div class="modal">'
    +'<div class="modal-header"><div class="modal-title">Highlight teilen</div><button class="btn-icon" onclick="set({modal:null})">✕</button></div>'
    +'<div class="modal-body">'+(profiles.length?profiles.map(function(p){return '<button class="btn btn-primary" style="width:100%;justify-content:center;margin-bottom:8px" onclick="shareHighlight(\''+hlId+'\',\''+p.id+'\')">Teilen mit '+(p.display_name||p.email)+'</button>';}).join(''):'<div style="font-size:14px;color:var(--text3);text-align:center;padding:16px">Noch niemand registriert.</div>')+'</div>'

  return '<div class="modal-overlay" onclick="if(event.target===this)set({modal:null})"><div class="modal">'
    +'<div class="modal-header"><div class="modal-title">Einstellungen</div><button class="btn-icon" onclick="set({modal:null})">✕</button></div>'
    +'<div class="modal-body">'
    +'<div class="form-group"><label>Anthropic API Key</label><input type="password" id="api-key-input" value="'+S.anthropicKey+'" placeholder="sk-ant-..." style="font-family:monospace;font-size:13px"/><div style="font-size:12px;color:var(--text3);margin-top:5px">Nur lokal gespeichert. Für Matrix-Analyse. → <a href="https://console.anthropic.com" target="_blank" style="color:var(--accent2)">console.anthropic.com</a></div></div>'
    +'<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px">'
    +'<button class="btn btn-secondary" onclick="set({modal:null})">Abbrechen</button>'
    +'<button class="btn btn-primary" onclick="saveSettings()">Speichern</button>'
    +'</div></div></div></div>';

window.set=set;window.analyze=analyze;
window.deleteBook=deleteBook;window.deleteFolder=deleteFolder;
window.deleteHighlight=deleteHighlight;window.shareHighlight=shareHighlight;window.markSeen=markSeen;

window.pickColor=function(c){S.selectedColor=c;render();};
window.pickStar=function(n){
  S.selectedStars=n;
  for(var i=1;i<=5;i++){var b=document.getElementById('star-'+i);if(b)b.textContent=i<=n?'★':'☆';}
};
window.submitAddFolder=function(){

  if(!name){toast('Name eingeben','error');return;}
  addFolder(name,S.selectedColor);S.selectedColor=FOLDER_COLORS[0];
};
window.submitAddBook=function(folderId){
  var t=document.getElementById('nb-title').value.trim();
  var a=document.getElementById('nb-author').value.trim();
  var s=document.getElementById('nb-status').value||'reading';
  var folderEl=document.getElementById('nb-folder');
  var f=folderId||(folderEl?folderEl.value:'')||null;
  if(!t||!a){toast('Titel und Autor angeben','error');return;}
  addBook(t,a,s,S.selectedStars,f||null);S.selectedStars=0;
};
window.submitEditBook=function(id){
  var s=document.getElementById('eb-status').value;
  updateBook(id,{status:s,rating:S.selectedStars});S.selectedStars=0;
};
window.submitHighlight=function(bookId){
  // Check if we have split highlights to save
  if(S._splitHighlights&&S._splitHighlights.length>0&&S.photoTab==='paste'){
    saveSplitHighlights(bookId);return;
  }
  var text='';
  if(S.photoTab==='paste'){
    text=(document.getElementById('paste-text')||{value:''}).value.trim();
  }else{
    text=(document.getElementById('hl-text')||{value:''}).value.trim();
  }
  var note=(document.getElementById('hl-note')||{value:''}).value.trim();
  var page=(document.getElementById('hl-page')||{value:''}).value.trim();
  var imagePath=S._pendingImagePath||null;
  if(!text&&!imagePath){toast('Bitte Text eingeben oder Foto hochladen','error');return;}
  addHighlight(bookId,text||'[Foto-Highlight]',note||null,page||null,imagePath);
};

window.usePasteAsOne=function(){
  var text=(document.getElementById('paste-text')||{value:''}).value.trim();
  if(!text){toast('Bitte Text einfügen','error');return;}
  var hlText=document.getElementById('hl-text');
  // Switch to text tab with the pasted content
  S.photoTab='text';
  S._splitHighlights=null;
  render();
  setTimeout(function(){
    var el=document.getElementById('hl-text');
    if(el)el.value=text;
  },50);
};

window.splitHighlights=async function(bookId){
  var text=(document.getElementById('paste-text')||{value:''}).value.trim();
  if(!text){toast('Bitte Text einfügen','error');return;}
  if(!S.anthropicKey){toast('API Key fehlt — bitte in Einstellungen eintragen','error');return;}
  var btn=document.querySelector('[onclick="splitHighlights(''+bookId+'')"]');
  if(btn){btn.disabled=true;btn.textContent='⏳ Analysiere...';}
  try{
    var r=await fetch('/api/proxy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
      apiKey:S.anthropicKey,
      model:'claude-sonnet-4-20250514',
      max_tokens:2000,
      messages:[{role:'user',content:'Teile diesen Text in einzelne sinnvolle Highlights auf. Jedes Highlight sollte ein eigenständiger Gedanke, Satz oder Abschnitt sein. Gib NUR ein JSON-Array zurück, keine Erklärungen:\n["Highlight 1","Highlight 2",...]\n\nText:\n'+text}]
    })});
    var d=await r.json();
    if(d.error)throw new Error(d.error.message);
    var raw=(d.content&&d.content[0]?d.content[0].text:'').replace(/```json|```/g,'').trim();
    var splits=JSON.parse(raw);
    if(!Array.isArray(splits)||splits.length===0)throw new Error('Keine Highlights erkannt');
    S._splitHighlights=splits;
    // Show preview
    var preview=document.getElementById('paste-preview');
    if(preview){
      preview.style.display='block';
      preview.innerHTML='<div style="font-size:13px;font-weight:500;color:var(--accent2);margin-bottom:10px">'+splits.length+' Highlights erkannt — klicke zum Entfernen:</div>'
        +splits.map(function(h,i){
          return '<div id="split-'+i+'" style="font-size:13px;font-family:var(--serif);font-style:italic;border-left:2px solid var(--accent2);padding:8px 12px;margin-bottom:8px;background:var(--accent-light);border-radius:0 var(--radius-sm) var(--radius-sm) 0;cursor:pointer;position:relative" onclick="removeSplit('+i+')">'
            +h+'<span style="position:absolute;right:8px;top:6px;font-size:16px;font-style:normal;color:var(--text3)">×</span></div>';
        }).join('');
    }
    // Update save button
    var saveBtn=document.getElementById('hl-save-btn');
    if(saveBtn)saveBtn.textContent='Alle '+splits.length+' speichern';
  }catch(e){
    toast('Fehler: '+e.message,'error');
  }
  if(btn){btn.disabled=false;btn.textContent='🧠 KI aufteilen';}
};

window.removeSplit=function(idx){
  if(!S._splitHighlights)return;
  S._splitHighlights=S._splitHighlights.filter(function(h,i){return i!==idx;});
  var el=document.getElementById('split-'+idx);
  if(el)el.style.display='none';
  var saveBtn=document.getElementById('hl-save-btn');
  if(saveBtn)saveBtn.textContent='Alle '+S._splitHighlights.length+' speichern';
};

async function saveSplitHighlights(bookId){
  var splits=S._splitHighlights;
  if(!splits||!splits.length)return;
  var note=(document.getElementById('hl-note')||{value:''}).value.trim();
  var page=(document.getElementById('hl-page')||{value:''}).value.trim();
  var btn=document.getElementById('hl-save-btn');
  if(btn){btn.disabled=true;btn.textContent='Speichere...';}
  var saved=0;
  for(var i=0;i<splits.length;i++){
    if(!splits[i]||splits[i].length<5)continue;
    var res=await sb.from('highlights').insert({book_id:bookId,user_id:S.user.id,text:splits[i],note:note||null,page:page||null,image_url:null}).select().single();
    if(!res.error){
      var existing=S.highlights[bookId]||[];
      S.highlights[bookId]=[res.data].concat(existing);
      saved++;
    }
  }
  S._splitHighlights=null;
  set({modal:null,matrix:null,photoTab:'text'});
  toast(saved+' Highlights gespeichert');
}
window.handlePhoto=async function(event,bookId){
  var file=event.target.files[0];if(!file)return;
  var objectUrl=URL.createObjectURL(file);
  var preview=document.getElementById('photo-preview-area');
  if(preview)preview.innerHTML='<img src="'+objectUrl+'" class="photo-preview"/><div style="font-size:13px;color:var(--accent2)">⏳ Foto wird hochgeladen...</div>';
  var btn=document.getElementById('hl-save-btn');if(btn)btn.disabled=true;
  var path=await uploadImage(file,S.user.id);
  if(path){
    S._pendingImagePath=path;
    if(preview)preview.innerHTML='<img src="'+objectUrl+'" class="photo-preview"/><div style="font-size:13px;color:var(--accent2)">✓ Foto gespeichert — wird bei der Matrix-Analyse berücksichtigt</div>';
  }else{
    if(preview)preview.innerHTML='<img src="'+objectUrl+'" class="photo-preview"/><div style="font-size:13px;color:#c0392b">Upload fehlgeschlagen</div>';
  }
  if(btn)btn.disabled=false;
};
window.saveSettings=function(){
  var key=(document.getElementById('api-key-input').value||'').trim();
  S.anthropicKey=key;localStorage.setItem(ANT_KEY,key);
  set({modal:null});toast('Gespeichert');

  var sess=await sb.auth.getSession();
  if(sess.data.session){

    await loadAll();await loadInbox();await loadProfiles();
  }

      S.user=session.user;
      var pr=await sb.from('profiles').select('*').eq('id',session.user.id).single();

      set({view:'library'});

      set({user:null,profile:null,books:[],highlights:{},inbox:[],inboxUnseen:0,folders:[],selectedBook:null,matrix:null});
    }
  });
})();
